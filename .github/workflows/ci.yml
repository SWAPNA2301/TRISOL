name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: mypy
        run: mypy src/trisol
      - name: pytest
        run: pytest tests -q --cov=trisol --cov-report=xml
      - name: self-audit the demo agents
        # The tool must find the planted defects in its own demo targets and
        # exit non-zero when it does -- that exit code is the contract CI relies
        # on, so a regression in it must fail the build.
        shell: bash
        run: |
          for d in src/trisol/demos/*/; do
            trisol audit "$d" --offline --quiet --no-color --no-unicode && code=0 || code=$?
            echo "$d -> exit $code"
            if [ "$code" -ne 1 ]; then
              echo "expected exit 1 (findings) for $d, got $code"
              exit 1
            fi
          done
      - name: clean target must pass
        shell: bash
        run: |
          mkdir -p /tmp/clean
          printf 'x = 1\n' > /tmp/clean/ok.py
          trisol audit /tmp/clean --offline --quiet --no-color --no-unicode && code=0 || code=$?
          # Nothing to examine is exit 2, not a false pass.
          test "$code" = "2"
