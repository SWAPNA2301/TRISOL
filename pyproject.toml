[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trisol"
version = "0.2.0"
description = "Agent lifecycle verification: test, benchmark and fix AI agent codebases"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# No runtime dependencies on purpose: a tool dropped into someone else's CI
# should not bring a dependency tree with it.
dependencies = []

[project.scripts]
trisol = "trisol.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/trisol"]
artifacts = ["src/trisol/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "PL", "N"]
# SIM905 (prefer a list literal over str.split) fights E501 for long word
# lists, and the split form is the readable one.
# RUF001/RUF003 flag look-alike Unicode; this is a terminal UI that draws
# with `›`, `·`, box-drawing and block glyphs on purpose.
# PLR0911/PLR0915 fire on declarative code -- key decoding, argparse wiring,
# the menu table -- where early returns and flat lists read best.
ignore = [
    "PLR0911", "PLR0913", "PLR0915", "PLR2004", "S101", "SIM905", "RUF001", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR2004", "PLC0415"]
# Deliberately flawed agents: their defects are the point.
"src/trisol/demos/*" = ["ALL"]

[tool.mypy]
python_version = "3.10"
exclude = ["src/trisol/demos/"]
warn_unused_ignores = true
